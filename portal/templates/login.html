<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENSCA — Connect</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; padding: 2rem; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 340px; }
    h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p.sub { margin: 0 0 1.5rem; color: #777; font-size: 0.85rem; }
    .field { display: flex; align-items: center; margin-bottom: 1rem;
             border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
    .field input { flex: 1; padding: 0.55rem; border: none; outline: none;
                   font-size: 1rem; }
    .field .suffix { padding: 0.55rem 0.6rem; color: #999; background: #fafafa;
                     border-left: 1px solid #eee; font-size: 0.95rem; }
    button { width: 100%; padding: 0.65rem; background: #0070f3;
             color: white; border: none; border-radius: 4px; cursor: pointer;
             font-size: 1rem; }
    .error { color: #d00; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Connect with your ENS name</h2>
    <p class="sub">Enter your ENS name to get on the network.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" action="/login">
      <div class="field">
        <input type="text" name="ens_name" placeholder="yourname" autocomplete="off"
               autocapitalize="off" spellcheck="false" required autofocus>
        <span class="suffix">.eth</span>
      </div>
      <button type="submit">Connect</button>
    </form>
  </div>
</body>
</html>
